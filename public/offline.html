<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>غير متصل · Offline · EduMind</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --brand: #00c950;
        --brand-ink: #047857;
        --hairline: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "IBM Plex Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
        background-image: radial-gradient(circle at 50% 0%, rgba(0, 201, 80, 0.09), transparent 55%);
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid var(--hairline);
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 24px 60px -40px rgba(16, 38, 44, 0.45);
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        margin: 0 auto 18px;
        display: block;
        box-shadow: 0 0 0 1px rgba(0, 201, 80, 0.25);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 6px;
        font-size: 13px;
        line-height: 1.8;
        color: var(--muted);
      }
      .en {
        direction: ltr;
        font-size: 12px;
      }
      button {
        margin-top: 20px;
        padding: 10px 22px;
        border: 0;
        border-radius: 12px;
        background: var(--brand);
        color: #04130c;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #10b981;
      }
      .hint {
        margin-top: 14px;
        font-size: 11px;
        color: var(--brand-ink);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/favicon/icon-192.png" alt="EduMind" width="64" height="64" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>افتح EduMind تاني أول ما يرجع الاتصال. الصفحات اللي زرتها قبل كده متاحة بدون إنترنت.</p>
      <p class="en">You're offline. Reconnect to keep learning — pages you visited before are still available.</p>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة · Try again</button>
      <p class="hint">EduMind · تعلّم أذكى</p>
    </main>
  </body>
</html>
